<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ケーキハウス「ケーク」</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <p>洋菓子専門店「ケーク」大阪 阿倍野 帝塚山</p>
    <h1>ケーキハウス「ケーク」</h1>
  </div>

  <div class="intro">
    <h2>ケーキハウス「ケーク」へようこそ</h2>
    <p>このサイトでは、人気のケーキを紹介します。</p>
  </div>

  <div class="cakes">
    <div class="cake">
      <div class="cake-title">
        <span class="number">01</span>
        <h3>ショートケーキ</h3>
      </div>
      <div class="cake-image">
        <img src="images/cake01.jpg" alt="ショートケーキ">
      </div>
      <div class="cake-text">
        <p>イチゴがのった一番人気のスポンジケーキです。大人から子供まで、年中愛されるケーキです。</p>
      </div>
    </div>

    <div class="cake">
      <div class="cake-title">
        <span class="number">02</span>
        <h3>モンブラン</h3>
      </div>
      <div class="cake-image">
        <img src="images/cake02.jpg" alt="モンブラン">
      </div>
      <div class="cake-text">
        <p>栗をふんだんに使ったケーキです。様々な形状があります。</p>
      </div>
    </div>

    <div class="cake">
      <div class="cake-title">
        <span class="number">03</span>
        <h3>ザッハトルテ</h3>
      </div>
      <div class="cake-image">
        <img src="images/cake03.jpg" alt="ザッハトルテ">
      </div>
      <div class="cake-text">
        <p>こってりとしたチョコレートの濃厚な味わい</p>
      </div>
    </div>

    <div class="cake">
      <div class="cake-title">
        <span class="number">04</span>
        <h3>シュークリーム</h3>
      </div>
      <div class="cake-image">
        <img src="images/cake04.jpg" alt="シュークリーム">
      </div>
      <div class="cake-text">
        <p>サクサク生地と濃厚クリームは相性抜群</p>
      </div>
    </div>
  </div>

  <div class="footer">
    Copyright ケーキハウス Co.,Ltd. All Rights Reserved.
  </div>
</div>
</body>
</html>
