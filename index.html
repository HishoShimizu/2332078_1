<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ケーキハウス「ケーク」</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="bigbox">
  <div id="one">
    <img src="images/logo.png" width="180" alt="ケークのロゴ">
    <h1>ケーキハウス「ケーク」</h1>
    <p>洋菓子専門店「ケーク」大阪 阿倍野 帝塚山</p>
  </div>

  <div id="two">
    <div class="shop">
      <img src="images/shop.jpg" alt="ケーキハウス「ケーク」の店舗">
    </div>

    <div class="welcome">
      <h2>ケーキハウス「ケーク」へようこそ</h2>
      <p>このサイトでは、人気のケーキを紹介します。</p>
      <p>いらっしゃいませ</p>
    </div>
  </div>

  <div id="three">
    <div class="row">
      <div class="cakes">
        <h2>ショートケーキ</h2>
        <img src="images/cake01.jpg" alt="ショートケーキ">
        <p>イチゴがのった一番人気のスポンジケーキです。大人から子供まで、年中愛されるケーキです。</p>
      </div>

      <div class="cakes">
        <h2>モンブラン</h2>
        <img src="images/cake02.jpg" alt="モンブラン">
        <p>栗をふんだんに使ったケーキです。様々な形状があります。</p>
      </div>
    </div>

    <div class="row">
      <div class="cakes">
        <h2>ザッハトルテ</h2>
        <img src="images/cake03.jpg" alt="ザッハトルテ">
        <p>こってりとしたチョコレートの濃厚な味わい</p>
      </div>

      <div class="cakes">
        <h2>シュークリーム</h2>
        <img src="images/cake04.jpg" alt="シュークリーム">
        <p>サクサク生地と濃厚クリームは相性抜群</p>
      </div>
    </div>
  </div>

  <div id="footer">
    <p>Copyright ケーキハウス Co.,Ltd. All Rights Reserved.</p>
  </div>
</div>
</body>
</html>
